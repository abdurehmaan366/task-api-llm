services:
  app:
    build: .
    container_name: todo-api
    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:17
    container_name: todo-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: